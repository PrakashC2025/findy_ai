# DevMind model registry
#
# Every entry is a free / open-weight model that runs locally through Ollama.
# `size_gb` is the approximate download size of the default quantisation.
# `training_ok` records whether the license clearly permits fine-tuning on your
# data; non-OSI community licenses are marked false so DevMind never silently
# trains on them (see docs/models.md).
#
# Override or extend this file by copying it to ~/.devmind/models.toml.
# A user file is merged by `id`: same id replaces, new ids are appended.

[meta]
schema = 1
updated = "2025-10"

